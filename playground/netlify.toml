[build]
  publish = ".output/public"
  command = "npm run generate"

[build.environment]
  NODE_VERSION = "22"

# Missing versioned runtime assets must fail instead of returning the SPA HTML.
# Existing static files take precedence because this rule is not forced.
[[redirects]]
  from = "/nuxt-document-scanner/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/_nuxt/*"
  to = "/404.html"
  status = 404

# SPA fallback for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API routes (if needed)
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache document scanner models
[[headers]]
  for = "/nuxt-document-scanner/v0.7.0/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/nuxt-document-scanner/v0.7.0/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache onnx runtime
[[headers]]
  for = "/nuxt-document-scanner/v0.7.0/onnx/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Runtime 1.30 needs both the WASM binary and its JavaScript companion.
[[headers]]
  for = "/nuxt-document-scanner/v0.7.0/onnx/ort-wasm-simd-threaded.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/nuxt-document-scanner/v0.7.0/onnx/ort-wasm-simd-threaded.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
