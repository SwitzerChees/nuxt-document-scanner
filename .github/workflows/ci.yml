name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

concurrency:
  group: scanner-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.4.2'

      - name: Install dependencies (module)
        run: bun install --frozen-lockfile

      - name: Install dependencies (playground)
        run: bun install --frozen-lockfile
        working-directory: playground

      - name: Prepare Nuxt types
        run: bun run dev:prepare

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run test:types

      - name: Generate static playground
        run: bun run dev:generate

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@27.13.0

      - name: Deploy to Netlify
        working-directory: playground
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_TEST }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: netlify deploy --dir=.output/public --no-build --prod --json
